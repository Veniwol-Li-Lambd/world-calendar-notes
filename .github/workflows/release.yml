name: Release
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (matches manifest.json)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build && npm test
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "$VERSION" --notes "World Calendar Notes $VERSION"
